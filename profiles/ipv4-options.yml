# Drop TCP packets whose IPv4 header carries options (IHL > 5).
# Legitimate TCP almost never uses IPv4 options; several kernel bugs over the years have been reachable
# only through them. All TCP packets with options are dropped, not only SYNs: that leaves no option-bearing
# TCP for any code path, and costs nothing for real traffic.
#
# PREROUTING (raw): every packet arriving at the host, before routing, DNAT, conntrack and the TCP stack.
#   It runs just after IPv4 defragmentation (the defrag hook comes first), so options are checked on the
#   reassembled header. Covers traffic to the host and traffic routed to container namespaces on it.
# OUTPUT (raw): packets the host itself generates, including host -> container on the same VM, which never
#   pass the host's PREROUTING.
- name: ipv4-options-tcp
  family: ipv4
  table: raw
  hook: PREROUTING
  match: '-p tcp -m u32 --u32 "0>>24&0x0F=6:15"'
  target: DROP
- name: ipv4-options-tcp-out
  family: ipv4
  table: raw
  hook: OUTPUT
  match: '-p tcp -m u32 --u32 "0>>24&0x0F=6:15"'
  target: DROP
