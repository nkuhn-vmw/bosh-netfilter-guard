# The IPv4-options rule delivered with os-conf-release's `iptables` job instead of netfilter-guard.
# os-conf is maintained under the Cloud Foundry org (https://github.com/cloudfoundry/os-conf-release).
#
# Trade-offs, measured on a Jammy BOSH VM with os-conf 23.0.4 (see docs/mitigation-matrix.md):
#   - Applied by monit, after the BOSH agent starts jobs: after a reboot the rule was absent for 58 s once the
#     VM was reachable again.
#   - `monit stop` (every deploy and restart) runs disable.sh, which FLUSHES the chain: 28 s without the rule on
#     each `bosh restart`.
#   - The jump to `pfbr-custom-<chain>` is APPENDED to the built-in chain, so any earlier ACCEPT wins, and nothing
#     ever repairs that. raw/PREROUTING is normally empty on stemcells, so it works there; it's riskier in
#     filter/FORWARD.
#   - Removing the job leaves empty chains and jumps behind until reboot.
#   - No validation, drift repair, monitor mode or evidence tooling.
releases:
- name: os-conf
  version: 23.0.4            # upload from bosh.io first
addons:
- name: os-conf-ipv4-options
  jobs:
  - name: iptables
    release: os-conf
    properties:
      iptables:
        raw:
          PREROUTING:
          - -p tcp -m u32 --u32 "0>>24&0x0F=6:15" -j DROP
          OUTPUT:
          - -p tcp -m u32 --u32 "0>>24&0x0F=6:15" -j DROP
  include:
    stemcell:
    - os: ubuntu-jammy
    deployments:
    - my-canary-deployment
